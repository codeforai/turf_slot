[project]
name = "turfslot-api"
version = "1.0.0"
description = "FastAPI + PostgreSQL backend for the TurfSlot turf booking platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N", "C4", "RUF"]
ignore = [
  "B008",   # FastAPI Depends()/Query() in defaults is idiomatic
  "S101",   # assert is fine in tests
  "RUF012", # mutable class defaults
  "N818",   # short exception names (NotFound, Conflict) read better here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/cli.py" = ["E501", "S105"]
"monitoring/loadtest.py" = ["S310", "S311", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
