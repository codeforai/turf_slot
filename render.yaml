# Render Blueprint: New > Blueprint > pick this repo. Creates the API and a PostgreSQL database.
services:
  - type: web
    name: turfslot-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    # Only deploy commits whose GitHub checks (CI above) passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: turfslot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      # Loads the demo turfs and accounts on startup (free instances have no shell to run it by hand).
      - key: SEED_DEMO
        value: "true"
      - key: LOG_JSON
        value: "true"
      # Protects /metrics. Use this value as the bearer token in your Prometheus / Grafana Cloud scrape job.
      - key: METRICS_TOKEN
        generateValue: true
      # Local disk on free instances is wiped on every deploy. For persistent images set
      # STORAGE_BACKEND=cloudinary and CLOUDINARY_URL (free Cloudinary account).
      - key: STORAGE_BACKEND
        value: local
      - key: CLOUDINARY_URL
        sync: false
      # console = emails are logged, not sent. Set EMAIL_BACKEND=smtp plus SMTP_* to deliver them.
      - key: EMAIL_BACKEND
        value: console
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: turfslot-db
    plan: free
    region: singapore
    databaseName: turfslot
    user: turfslot
